<!doctype html>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Tiro+Bangla:ital@0;1&display=swap">
<style>
/* Layout: night-blue header band over a chalk ground; 2-column tile dashboard, Excel-style grid tables, bottom sheets for entry detail. Tribute opens on a lamp-lit night panel. */
:root{
  --bg:#FAF6F5; --surface:#FFFFFF; --ink:#211A33; --muted:#6A6279; --line:#E3D8D8; --chip:#F2E9E7;
  --accent:#B4510B; --accent-ink:#FFFFFF; --gold:#C98A0B;
  --dr:#1D4ED8; --cr:#C62828; --ok:#1F7A4D;
  --night:#17132B; --night-ink:#F6E9D2; --night-gold:#F0B83A;
  --font-display:"Tiro Bangla","Hind Siliguri",Georgia,serif;
  --font-body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13101F; --surface:#1D1930; --ink:#F1EBF5; --muted:#A79FB8; --line:#342E4A; --chip:#272140;
    --accent:#F0A030; --accent-ink:#1B1204; --gold:#F0B83A;
    --dr:#7FA8FF; --cr:#FF8A80; --ok:#6FD3A0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13101F; --surface:#1D1930; --ink:#F1EBF5; --muted:#A79FB8; --line:#342E4A; --chip:#272140;
  --accent:#F0A030; --accent-ink:#1B1204; --gold:#F0B83A;
  --dr:#7FA8FF; --cr:#FF8A80; --ok:#6FD3A0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
body.on-tribute::before{background:#0F0C1E}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dr{color:var(--dr);font-family:var(--font-num);font-weight:600;white-space:nowrap}
.cr{color:var(--cr);font-family:var(--font-num);font-weight:600;white-space:nowrap}
.zero,.num{font-family:var(--font-num);white-space:nowrap}
.muted{color:var(--muted)}
.sm{font-size:12.5px}

/* top bar: full-bleed band, content aligned to page gutter */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--night);color:var(--night-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.15;flex:1;min-width:0;text-wrap:balance}
.top h1 small{display:block;font-family:var(--font-body);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--night-gold);margin-top:1px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid rgba(246,233,210,.28);background:transparent;color:var(--night-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.banner{margin:10px 0 0;padding:8px 10px;border:1px solid var(--line);background:var(--chip);border-radius:8px;font-size:13px}

/* icons */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* dashboard */
.hero{margin-top:14px;padding:16px;border-radius:14px;background:var(--night);color:var(--night-ink)}
.hero .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--night-gold)}
.hero .big{font-family:var(--font-num);font-size:30px;font-weight:600;margin:2px 0 6px}
.hero .big .dr{color:#9DBBFF}.hero .big .cr{color:#FF9D95}.hero .big .zero{color:var(--night-ink)}
.hero .row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.hero .row span.k{opacity:.75;margin-right:4px}
.hero .row .dr{color:#9DBBFF}.hero .row .cr{color:#FF9D95}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:13px 13px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tile:active{background:var(--chip)}
.tile .t{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:13.5px}
.tile .v{font-family:var(--font-num);font-size:19px;font-weight:600;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.wide{grid-column:1/-1}
h2.sec{font-family:var(--font-display);font-weight:400;font-size:17px;margin:20px 0 8px}

/* toolbars */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.bar .grow{flex:1 1 140px;min-width:0}
.in{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
select.in{padding-right:6px}
.btn{min-height:42px;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--cr);border-color:var(--cr);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#1B0A09}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.danger{color:#1B0A09}}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px}

/* Excel-style tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{border:1px solid var(--line);padding:7px 6px;vertical-align:top;text-align:left}
.tb th{background:var(--chip);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tb td.r,.tb th.r{text-align:right}
.tb tbody tr[data-act]{cursor:pointer}
.tb tbody tr[data-act]:active{background:var(--chip)}
.tb tfoot td{background:var(--chip);font-weight:600}
.tb .two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tb .sub{display:block;font-size:11.5px;color:var(--muted)}
.tb td:first-child,.tb th:first-child{border-left:0}.tb td:last-child,.tb th:last-child{border-right:0}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.bar2{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:4px}
.bar2 i{display:block;height:100%;background:var(--accent)}
.bar2 i.over{background:var(--cr)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:11px;color:var(--muted);border-radius:8px}
.nav a[aria-current="page"]{color:var(--accent);font-weight:600}
.nav .ic{width:21px;height:21px}

/* sheet */
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,8,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh .hd h3{margin:0;flex:1;font-family:var(--font-display);font-weight:400;font-size:18px}
.sh .hd button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1.3fr .8fr 1fr;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .grow{flex:1}
.irow{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.irow .top2{display:flex;gap:6px;margin-bottom:6px}
.irow .top2 .in{flex:1}
.irow .rm{width:38px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer;font-size:18px;color:var(--cr)}
.tot{display:flex;justify-content:space-between;padding:8px 2px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--night);color:var(--night-ink);padding:9px 14px;border-radius:10px;font-size:13.5px;max-width:90%}

/* tribute */
.tr{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:26px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 60% at 50% 0%,#2B1D4D 0%,#150F28 55%,#0F0C1E 100%);color:#F6E9D2;min-height:100vh}
.tr .in{background:#1D1735;border-color:#41366A;color:#F6E9D2}
.tr .in::placeholder{color:#8F84AE}
.tr .btn{background:#F0B83A;border-color:#F0B83A;color:#1B1204}
.tr .wrapt{max-width:520px;margin:0 auto}
.diya{position:relative;width:92px;height:70px;margin:0 auto 6px}
.diya .bowl{position:absolute;left:6px;right:6px;bottom:0;height:30px;border-radius:6px 6px 46px 46px/6px 6px 30px 30px;background:linear-gradient(#D9772B,#8F3C12)}
.diya .glow{position:absolute;left:50%;top:6px;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,80,.38),transparent 65%)}
.diya .fl{position:absolute;left:50%;bottom:28px;width:22px;height:38px;margin-left:-11px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 75%,#FFF3C4 0 25%,#FFC247 55%,#F0701E 100%);transform-origin:50% 100%}
@media (prefers-reduced-motion: no-preference){
  .diya .fl{animation:flick 2.6s ease-in-out infinite}
  .diya .glow{animation:glow 3.2s ease-in-out infinite}
}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}30%{transform:scale(.94,1.06) rotate(2deg)}60%{transform:scale(1.03,.96) rotate(-2deg)}}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
.scene{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:0 auto 8px;max-width:340px}
.scene .diya{margin:0 0 4px;flex:none}
.sc{flex:none;overflow:visible}
.sm{fill:none;stroke:#CDBFE6;stroke-width:1.8;stroke-linecap:round;opacity:0}
.em{opacity:.9}
@media (prefers-reduced-motion: no-preference){
  .sm{stroke-dasharray:70;stroke-dashoffset:70;animation:smoke 4.2s ease-in-out infinite}
  .sm.s2{animation-delay:1.3s}.sm.s3{animation-delay:2.4s}
  .em{animation:ember 1.8s ease-in-out infinite}
  .sway{transform-origin:55px 90px;animation:sway 5s ease-in-out infinite}
}
@keyframes smoke{0%{stroke-dashoffset:70;opacity:0}20%{opacity:.7}70%{stroke-dashoffset:0;opacity:.4}100%{stroke-dashoffset:-70;opacity:0}}
@keyframes ember{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
.frame{position:relative;flex:none;padding:7px;border-radius:5px;background:linear-gradient(135deg,#F6D77A,#B07A18 45%,#F6D77A 70%,#8A5A0E);box-shadow:0 3px 10px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,236,170,.65)}
.frame::before{content:"";position:absolute;inset:3px;border:1px solid rgba(70,40,4,.75);border-radius:3px;pointer-events:none}
.frame::after{content:"";position:absolute;inset:-3px;pointer-events:none;background:radial-gradient(circle at 0 0,#FFE9A0 0 4px,#9A6410 5px,transparent 6px),radial-gradient(circle at 100% 0,#FFE9A0 0 4px,#9A6410 5px,transparent 6px),radial-gradient(circle at 0 100%,#FFE9A0 0 4px,#9A6410 5px,transparent 6px),radial-gradient(circle at 100% 100%,#FFE9A0 0 4px,#9A6410 5px,transparent 6px)}
.frame .mat{padding:4px;background:#F3E7C8;border-radius:2px}
.tr .frame .av,.frame .av{display:grid;width:78px;height:98px;border-radius:1px;border:0;object-fit:cover;background:#1D1735;color:#F0B83A;font-size:26px}
.tr .tl.def{border-left-color:#F0B83A;color:#FFE9B8}
.tr h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,10vw,48px);line-height:1.1;margin:8px 0 4px;text-align:center;color:#F0B83A}
.tr .org{text-align:center;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#CDBFE6}
.tr .msg{margin:18px auto 0;max-width:46ch;text-align:center;font-size:16px;color:#EBDDC4}
.tr .mantra{margin:16px 0 0;text-align:center;font-family:var(--font-display);font-size:19px;color:#F0B83A}
.tr .mantra small{display:block;font-family:var(--font-body);font-size:12.5px;color:#B9AEC9;letter-spacing:.05em;margin-top:2px}
.tr h2{font-family:var(--font-display);font-weight:400;font-size:18px;margin:28px 0 8px;color:#F6E9D2}
.tr .wall{display:grid;gap:8px;margin-top:10px}
.tr .tc{padding:10px 12px;border:1px solid #3A2F60;border-radius:10px;background:#1A1431}
.tr .tc p{margin:0 0 4px;color:#F1E5CE;overflow-wrap:anywhere}
.tr .tc .by{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#B9AEC9}
.tr .tc button{background:none;border:0;color:#B9AEC9;cursor:pointer;font-size:12px;padding:0}
.tr .empty{background:#1A1431;border-color:#3A2F60;color:#B9AEC9}.tr .empty b{color:#F6E9D2}
.tr .enter{display:block;width:100%;margin-top:22px;min-height:48px;font-size:16px}
.ra{white-space:nowrap;text-align:right;padding:4px!important}
.ra button{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:transparent;cursor:pointer;color:var(--ink);margin-left:4px;padding:0;display:inline-grid;place-items:center}
.ra button.d{color:var(--cr)}
.ra .ic{width:16px;height:16px}
.rolebtn{max-width:150px;text-align:left;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;min-height:34px;line-height:1.25}
.rolebtn.none{color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.ck{width:20px;height:20px;accent-color:var(--accent);flex:none}
.rolesl{max-height:46vh;overflow:auto;margin-bottom:8px}
.ib.on{background:var(--night-gold);color:var(--night);border-color:var(--night-gold)}
.lockd{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.lockd .ic{width:13px;height:13px}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--chip);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:13px;font-weight:600;color:var(--accent);flex:none}
.av.lg{width:56px;height:56px;font-size:20px}
.av.xl{width:88px;height:88px;font-size:30px}
.mc{display:flex;align-items:center;gap:8px;min-width:0}
.wa{margin-top:12px}
.wab{display:grid;place-items:center;text-decoration:none;background:#187A41;border-color:#187A41;color:#fff;width:100%;margin-bottom:6px}
.mcn{min-width:0}
.pv{display:flex;justify-content:center;margin-bottom:10px}
.phb{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.phb-a{display:flex;gap:6px;flex-wrap:wrap}
.tr .dh{display:flex;gap:12px;align-items:center}
.tr .av{border-color:#41366A;background:#1D1735;color:#F0B83A}
.tr .trtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:26px 0 10px;color:#CDBFE6;font-size:13px;letter-spacing:.04em}
.tr .dc h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px;color:#F0B83A}
.tr .dmeta{font-size:12.5px;color:#B9AEC9;margin:2px 0 6px}
.tr .tl{margin:8px 0 0;padding-left:10px;border-left:2px solid #6B5A2E;font-size:14px;color:#F1E5CE;overflow-wrap:anywhere}
.tr .tl .by{display:block;font-size:12px;color:#B9AEC9}
.tr .dact{display:flex;gap:8px;margin-top:12px}
.tr .dact .btn{background:#F0B83A;border:1px solid #F0B83A;color:#1B1204;min-height:34px;padding:4px 12px;font-size:13px;font-weight:600}
.tr .dact .btn.ghost{background:transparent;color:#F0B83A}
.tr .trtop .btn{background:#F0B83A;border-color:#F0B83A;color:#1B1204}
</style>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
var money=function(n){return '₹'+nf.format(n||0)};
var r2=function(n){return Math.round((n||0)*100)/100};
var drcr=function(n){n=r2(n);if(n>0)return '<span class="dr">'+money(n)+' Dr</span>';if(n<0)return '<span class="cr">'+money(-n)+' Cr</span>';return '<span class="zero">₹0</span>'};
var dr=function(n){return n?'<span class="dr">'+money(n)+'</span>':''};
var cr=function(n){return n?'<span class="cr">'+money(n)+'</span>':''};
var sum=function(a,f){return a.reduce(function(s,x){return s+(+f(x)||0)},0)};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var todayISO=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var dshort=function(i){var p=(i||'').split('-');return p.length===3?p[2]+' '+MON[+p[1]-1]:''};
var dlong=function(i){var p=(i||'').split('-');return p.length===3?p[2]+' '+MON[+p[1]-1]+' '+p[0]:''};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

var MODES=['Cash','UPI','Bank Transfer','Cheque','Online / Card'];
var CATS=['Member subscription','Donation','Advertisement / Sponsor','Stall / Rent','Other'];
var ROLES=['Admin','President','Vice President','Secretary','Joint Secretary','Treasurer','Cashier','Puja Convenor','Collection In-charge','Pandal & Decoration','Bhog & Prasad','Volunteer Captain','Advisor','Member'];
var DEF_HEADS=['Pandal & Decoration','Pratima (Idol)','Puja Samagri','Flowers & Garlands','Bhog & Prasad','Purohit Dakshina','Dhak & Music','Lighting & Electrical','Sound System','Printing & Banners','Transport','Immersion','Miscellaneous'];

var COLS=['members','vendors','collections','expenses','departed','tributes','meta'];
var S={members:[],vendors:[],collections:[],expenses:[],departed:[],tributes:[],meta:{}};
var db=null,canWrite=true,state='loading',banner='',pending={},timer=null;
var F={q:'',mode:'',cat:'',head:''};
var route='tribute';

/* ---------- data helpers ---------- */

var VAULT={priv:null,me:null},RSA={name:'RSA-OAEP',hash:'SHA-256'},pcache={},idleAt=Date.now(),pubFor=null,pubP=null,migrating=false;

var vaultPub=function(){return (S.meta.vault&&S.meta.vault.pub)||''};
var hasVault=function(){return !!vaultPub()};
var adminCount=function(){return S.members.filter(function(m){return m.wrap}).length};

async function createVault(){
  var kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
  var pub=b64e(await crypto.subtle.exportKey('spki',kp.publicKey));
  if(!(await put('meta','vault',{pub:pub})))throw new Error('save');
  S.meta.vault={pub:pub};pubFor=null;return kp.privateKey}
async function dropVault(){delete S.meta.vault;pubFor=null;if(db){try{await db.collection('meta').doc('vault').delete()}catch(e){}}else persistLocal()}
function getPhone(rec,field){
  if(!rec||!VAULT.priv)return '';

var hasPhone=function(rec,field){return !!(rec&&(rec[field]||rec[field+'Enc']))};
function phoneShow(rec,field){
  if(!hasPhone(rec,field))return '';
  if(VAULT.priv)return esc(getPhone(rec,field));
  return '<span class="lockd">'+ic('lock')+' Admin only</span>'}
function phoneField(id,rec,field,label){
  var has=hasPhone(rec,field),val=VAULT.priv?getPhone(rec,field):'';
  var ph=(!VAULT.priv&&has)?'Saved and hidden. Type to replace':'';

  if(hasVault()){var ct=b64e(await crypto.subtle.encrypt({name:'RSA-OAEP'},await getPub(),new TextEncoder().encode(raw)));doc[field+'Enc']=ct;pcache[id+'|'+field]={ct:ct,pt:raw}}

async function decryptAll(){
  if(!VAULT.priv)return 0;var n=0,jobs=[];
  [['members',['phone']],['vendors',['phone','phone2']],['collections',['phone']]].forEach(function(p){
    S[p[0]].forEach(function(r){p[1].forEach(function(f){
      var ct=r[f+'Enc'];if(!ct)return;var k=r.id+'|'+f,c=pcache[k];if(c&&c.ct===ct)return;
      jobs.push(crypto.subtle.decrypt({name:'RSA-OAEP'},VAULT.priv,b64d(ct)).then(function(buf){pcache[k]={ct:ct,pt:new TextDecoder().decode(buf)};n++}).catch(function(){pcache[k]={ct:ct,pt:''}}))})})});
  await Promise.all(jobs);return n}
async function migratePlain(){
  if(!hasVault()||migrating||!canWrite)return;migrating=true;var n=0;
  try{
    var plan=[['members',['phone']],['vendors',['phone','phone2']],['collections',['phone']]];
    for(var i=0;i<plan.length;i++){var col=plan[i][0],fs=plan[i][1],recs=S[col].slice();
      for(var j=0;j<recs.length;j++){var r=recs[j],todo=fs.filter(function(f){return r[f]});
        if(!todo.length)continue;
        var doc=clean(r);
        for(var k=0;k<todo.length;k++){delete doc[todo[k]];await setPhone(doc,r.id,todo[k],r[todo[k]])}
        if(await put(col,r.id,doc))n++}}
  }catch(e){}
  migrating=false;if(n)toast(n+' saved entries had their phone numbers locked')}

async function hGrant(f){
  var m=find('members',f.dataset.id),err=$('#g-err'),btn=f.querySelector('button[type=submit]'),pw=$('#g-pw').value,fresh=false;
  err.textContent='';if(!m)return;
  if(pw.length<10){err.textContent='Use at least 10 characters.';return}
  if(pw!==$('#g-pw2').value){err.textContent='The two passwords do not match.';return}
  var reset=function(){btn.disabled=false;btn.textContent='Make Admin'};
  if(hasVault()&&!VAULT.priv){err.textContent='Unlock as an existing Admin first (lock icon), then try again.';return}
  btn.disabled=true;btn.textContent='Setting up…';
  try{
    var priv=VAULT.priv;
    if(!hasVault()){priv=await createVault();fresh=true}
    var wrap=await wrapPriv(priv,pw);
    var doc=clean(m);doc.roles=rolesOf(m).filter(function(r){return r!=='Admin'});doc.roles.unshift('Admin');delete doc.role;doc.wrap=wrap;
    if(!(await put('members',m.id,doc))){if(fresh)await dropVault();reset();return}
    if(fresh){VAULT.priv=priv;VAULT.me=m.id;touch()}
    closeSheet();updateLockBtn();
    await decryptAll();await migratePlain();fillBody();
    toast(fresh?m.name+' is the first Admin. Phone numbers are now locked':m.name+' is now an Admin')
  }catch(e){if(fresh)await dropVault();err.textContent='Could not set up Admin access. Try again.';reset()}}

async function fileToPhoto(file){
  var bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){
    bmp=await new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=URL.createObjectURL(file)})}
  var w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,sq=Math.min(w,h),N=320;
  var c=document.createElement('canvas');c.width=N;c.height=N;

  return c.toDataURL('image/jpeg',0.8)}

async function hRoles(f){
  var m=find('members',f.dataset.id);if(!m)return;
  var sel=[];f.querySelectorAll('.ck:checked').forEach(function(c){sel.push(c.value)});
  var nr=$('#nr-name').value.trim();
  var wantAdmin=sel.indexOf('Admin')>=0,isAdm=!!m.wrap;
  sel=sel.filter(function(r){return r!=='Admin'});
  if(nr&&sel.indexOf(nr)<0)sel.push(nr);
  if(wantAdmin&&!isAdm&&hasVault()&&!VAULT.priv){toast('Unlock as an Admin first (lock icon), then tick Admin');return}
  if(isAdm&&!wantAdmin){
    if(!VAULT.priv){toast('Unlock as an Admin first to remove Admin access');return}
    if(adminCount()<2){toast('Keep at least one Admin. Add another Admin first');return}}
  if(nr&&!(await ensureRole(nr)))return;
  var doc=clean(m);delete doc.role;
  if(isAdm&&!wantAdmin)delete doc.wrap;
  doc.roles=(isAdm&&wantAdmin)?['Admin'].concat(sel):sel;
  if(!(await put('members',m.id,doc)))return;
  closeSheet();
  if(isAdm&&!wantAdmin&&VAULT.me===m.id)lockNow();
  if(wantAdmin&&!isAdm){grantSheet(m.id);return}
  toast(sel.length?'Roles saved for '+m.name:m.name+' has no roles now')}

   committee:{title:'Working Committee',sub:'Roles from member list',bar:committeeBar,body:committeeBody,back:'home'},
   vendors:{title:'Vendors',sub:'Details for future reference',bar:vendorsBar,body:vendorsBody,nav:'spend',back:'spend'},
   collect:{title:'Collections',sub:'Receipts by mode',bar:collectBar,body:collectBody,nav:'collect',back:'home'},
   spend:{title:'Puja Expenses',sub:'Vouchers',bar:spendBar,body:spendBody,nav:'spend',back:'home'},

  return D[r]||D.home}

  var d=routeDef(route);

    h='<header class="top">'+(d.back?'<a class="ib" href="#'+d.back+'" aria-label="Back">'+ic('back')+'</a>':'')+'<h1>'+esc(d.title)+'<small>'+esc(d.sub)+'</small></h1><button type="button" class="ib" id="lockbtn" data-act="admin-toggle"></button><a class="ib" href="#tribute" aria-label="Tribute page">'+ic('diya')+'</a></header>'+

var encFile=null;
async function checkEnc(){try{var r=await fetch('data.enc.json',{cache:'no-store'});if(r.ok){encFile=await r.json();return true}}catch(e){}return false}
var b64d=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})};
async function decryptData(pass){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(encFile.salt),iterations:encFile.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(encFile.iv)},key,b64d(encFile.ct));
  return JSON.parse(new TextDecoder().decode(pt))}

/* ---------- change log (super admin = app owner only) and duplicate clean-up ---------- */
var IS_OWNER=false,USERAPI=null,ME_ID='',LOG=[],LOGRAW=[],LOGDEC={},LOGPRIV=null,logKeyP=null,logKeyFor=null,NAMES={},LASTSYNC=0,logSub=false,LOGERR=false;
function fmtV(v){var t=String(v==null?'':v);return t.length>40?t.slice(0,40)+'…':t}
function diffSummary(o,n){
  var ks={};Object.keys(o||{}).forEach(function(k){ks[k]=1});Object.keys(n||{}).forEach(function(k){ks[k]=1});var out=[];
  Object.keys(ks).forEach(function(k){
    if(k==='ts'||k==='id')return;var a=o&&o[k],b=n&&n[k];if(JSON.stringify(a)===JSON.stringify(b))return;
    if(!o&&(b===''||b==null||(Array.isArray(b)&&!b.length)))return;
    if(k==='photo'||k==='wrap'||k==='items'||k==='pub'||k==='phone'||k==='phone2'||/Enc$/.test(k)){out.push(k.replace(/Enc$/,'')+' changed');return}
    out.push(o&&a!==undefined?k+': '+fmtV(a)+' → '+fmtV(b):k+': '+fmtV(b))});
  var t=out.join('; ');return t.length>300?t.slice(0,300)+'…':t}
function logPub(){var p=S.meta.logkey&&S.meta.logkey.pub;if(!p)return Promise.reject(new Error('nokey'));if(logKeyFor!==p){logKeyFor=p;logKeyP=crypto.subtle.importKey('spki',b64d(p),RSA,false,['encrypt'])}return logKeyP}
async function sealEntry(obj){
  var key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12));
  var c=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  var k=await crypto.subtle.encrypt({name:'RSA-OAEP'},await logPub(),await crypto.subtle.exportKey('raw',key));
  return {ts:obj.ts,k:b64e(k),iv:b64e(iv),c:b64e(c)}}
async function openEntry(e){
  var raw=await crypto.subtle.decrypt({name:'RSA-OAEP'},LOGPRIV,b64d(e.k));
  var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv)},key,b64d(e.c))))}
async function decryptLog(){
  if(!LOGPRIV)return;
  await Promise.all(LOGRAW.filter(function(e){return !(e.id in LOGDEC)}).map(function(e){return openEntry(e).then(function(o){LOGDEC[e.id]=Object.assign(o,{id:e.id})}).catch(function(){LOGDEC[e.id]=null})}));
  LOG=LOGRAW.map(function(e){return LOGDEC[e.id]}).filter(Boolean);
  var ids={};LOG.forEach(function(x){if(x.uid&&!(x.uid in NAMES))ids[x.uid]=1});var l=Object.keys(ids);
  if(l.length&&USERAPI&&USERAPI.profiles){l.forEach(function(i){NAMES[i]=''});try{var pr=await USERAPI.profiles(l);l.forEach(function(i){NAMES[i]=(pr&&pr[i]&&pr[i].name)||''})}catch(e){}}}
function logChange(col,id,old,data,kind){
  if(!db||col==='log'||!ME_ID||!(S.meta.logkey&&S.meta.logkey.pub))return;
  try{
    var act=kind||(old?'edit':'add'),ref=data||old||{};
    var label=col==='meta'?id:(ref.name||(ref.rno?ref.rno+' '+(ref.payer||''):'')||(ref.vno?ref.vno+' '+(ref.payee||''):'')||id);
    var d=act==='delete'?'':diffSummary(act==='edit'?old:null,data);
    if(act==='edit'&&!d)return;
    sealEntry({ts:Date.now(),uid:ME_ID,act:act,col:col,did:id,label:label,d:d}).then(function(doc){return db.collection('log').doc(uid()+Math.random().toString(36).slice(2,5)).set(doc)}).catch(function(){})
  }catch(e){}}
function subLog(){
  if(logSub||!db||!IS_OWNER)return;logSub=true;
  db.collection('log').onSnapshot(function(snap){
    LOGRAW=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
    decryptLog().then(function(){if(route==='log')fillBody()})},
  function(){logSub=false;LOGERR=true;if(route==='log')fillBody()})}
function lockLog(){LOGPRIV=null;LOG=[];LOGDEC={};if(route==='log')fillBody()}
setInterval(function(){if(LOGPRIV&&Date.now()-idleAt>600000){lockLog();toast('Change log locked after 10 minutes idle')}},15000);

async function hLogSetup(f){
  var err=$('#ls-err'),btn=f.querySelector('button[type=submit]'),pw=$('#ls-pw').value;err.textContent='';
  if(!IS_OWNER){err.textContent='Only the owner can do this.';return}
  if(pw.length<12){err.textContent='Use at least 12 characters.';return}
  if(pw!==$('#ls-pw2').value){err.textContent='The two passwords do not match.';return}
  btn.disabled=true;btn.textContent='Setting up…';
  try{
    var kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
    var pub=b64e(await crypto.subtle.exportKey('spki',kp.publicKey)),wrap=await wrapPriv(kp.privateKey,pw);
    if(!(await put('meta','logwrap',wrap))||!(await put('meta','logkey',{pub:pub}))){btn.disabled=false;btn.textContent='Turn on';return}
    S.meta.logkey={pub:pub};S.meta.logwrap=wrap;logKeyFor=null;LOGPRIV=kp.privateKey;idleAt=Date.now();
    closeSheet();await decryptLog();fillBody();toast('Change log is on')}
  catch(e){err.textContent='Could not set up the log. Try again.';btn.disabled=false;btn.textContent='Turn on'}}
async function hLogUnlock(f){
  var err=$('#lu-err'),btn=f.querySelector('button[type=submit]');err.textContent='';btn.disabled=true;btn.textContent='Opening…';
  try{LOGPRIV=await unwrapPriv(S.meta.logwrap,$('#lu-pw').value)}catch(e){err.textContent='Wrong password.';btn.disabled=false;btn.textContent='Open log';return}
  idleAt=Date.now();closeSheet();await decryptLog();fillBody()}
var COLNAME={members:'Members',vendors:'Vendors',collections:'Collections',expenses:'Expenses',departed:'Departed',tributes:'Tributes',meta:'Settings'};
var whoName=function(u){return u?(NAMES[u]||('User '+String(u).slice(-4))):'Unknown'};
function logBar(){return '<div class="bar"><input class="in grow" id="q" data-f="q" type="search" placeholder="Search user, entry or detail" value="'+esc(F.q)+'" aria-label="Search log"><select class="in" id="fc" data-f="cat" aria-label="Filter by section"><option value="">All sections</option>'+Object.keys(COLNAME).map(function(k){return '<option value="'+k+'"'+(F.cat===k?' selected':'')+'>'+COLNAME[k]+'</option>'}).join('')+'</select></div>'}
function logBody(){
  if(!IS_OWNER)return emptyBox('Super admin only','Only the owner of this app can open the change log.');
  if(!db)return emptyBox('No log on this copy','The change log is kept only in the shared app.');
  subLog();
  if(LOGERR)return emptyBox('Log not available','The log could not be read. Reopen the page.');
  if(!(S.meta.logkey&&S.meta.logkey.pub))return emptyBox('Change log is off','Turn it on to record who adds, edits or deletes entries.')+'<div class="acts"><button class="btn grow" type="button" data-act="log-setup">Turn on change log</button></div>';
  if(!LOGPRIV)return emptyBox('Log is locked',LOGRAW.length+' changes recorded. Enter your Super admin password to read them.')+'<div class="acts"><button class="btn grow" type="button" data-act="log-unlock">Open change log</button></div>';
  var q=F.q.toLowerCase();
  var rows=LOG.filter(function(x){return (!F.cat||x.col===F.cat)&&(!q||(whoName(x.uid)+' '+(x.label||'')+' '+(x.d||'')+' '+x.act).toLowerCase().indexOf(q)>=0)}).sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  if(!rows.length)return emptyBox(LOG.length?'No match':'No changes logged yet','Every add, edit and delete by any user will be listed here.');
  var shown=rows.slice(0,300),pad=function(n){return String(n).padStart(2,'0')};
  return '<div class="tw"><table class="tb"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Entry</th></tr></thead><tbody>'+
   shown.map(function(x){var dt=new Date(x.ts||0);return '<tr><td class="num">'+dshort(isoLocal(x.ts||0))+'<span class="sub">'+pad(dt.getHours())+':'+pad(dt.getMinutes())+'</span></td><td>'+esc(whoName(x.uid))+'</td><td>'+(x.act==='delete'?'<span style="color:var(--cr)">Deleted</span>':x.act==='add'?'<span style="color:var(--dr)">Added</span>':'Edited')+'</td><td><span class="two">'+esc(COLNAME[x.col]||x.col)+' · '+esc(x.label||'')+'</span>'+(x.d?'<span class="sub">'+esc(x.d)+'</span>':'')+'</td></tr>'}).join('')+
   '</tbody><tfoot><tr><td colspan="4">'+rows.length+' changes'+(rows.length>shown.length?' (latest 300 shown)':'')+'</td></tr></tfoot></table></div>'}

var normS=function(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()};
function dupScan(){
  var out=[];
  function group(col,keyf){var m={};S[col].forEach(function(x){var k=keyf(x);if(!k)return;(m[k]=m[k]||[]).push(x)});
    Object.keys(m).forEach(function(k){var g=m[k];if(g.length>1){g.sort(function(a,b){return (b.wrap?1:0)-(a.wrap?1:0)||(a.ts||0)-(b.ts||0)});out.push({col:col,keep:g[0],drop:g.slice(1)})}})}
  group('members',function(x){return normS(x.name)});
  group('vendors',function(x){return normS(x.name)});
  group('collections',function(x){return [normS(x.rno),x.date,normS(x.payer),+x.amount||0].join('|')});
  group('expenses',function(x){return [normS(x.vno),x.date,normS(x.payee),eTotal(x)].join('|')});
  group('departed',function(x){return normS(x.name)+'|'+(x.date||'')});
  group('tributes',function(x){return [x.forId,normS(x.name),normS(x.text)].join('|')});
  return out}
var dupLabel=function(g){var x=g.keep;return x.name||(x.rno?x.rno+' '+(x.payer||''):'')||(x.vno?x.vno+' '+(x.payee||''):'')||x.id};
function dupSheet(){
  var g=dupScan(),n=g.reduce(function(a,x){return a+x.drop.length},0);
  if(!g.length){sheet('Duplicates','<div class="empty"><b>No duplicates found</b>Members, vendors, receipts, vouchers and tributes all look unique.</div>');return}
  sheet('Duplicates found','<p class="muted sm" style="margin-top:0">The earliest entry is kept. For members and vendors, receipts and vouchers are moved to the kept entry and empty details are filled from the copies. Take a backup first if unsure.</p>'+
   '<div class="tw"><table class="tb"><thead><tr><th>Section</th><th>Entry</th><th class="r">Copies</th></tr></thead><tbody>'+g.map(function(x){return '<tr><td>'+esc(COLNAME[x.col])+'</td><td><span class="two">'+esc(dupLabel(x))+'</span></td><td class="r num">'+x.drop.length+'</td></tr>'}).join('')+'</tbody><tfoot><tr><td colspan="2">Total to remove</td><td class="r num">'+n+'</td></tr></tfoot></table></div>'+
   '<div class="acts"><button class="btn ghost" type="button" data-act="bk-open">Back up first</button><button class="btn danger grow" type="button" data-act="dedupe-run">Remove '+n+' duplicates</button></div>')}
async function dedupeRun(){
  var gs=dupScan(),n=0;
  for(var i=0;i<gs.length;i++){var g=gs[i],keep=g.keep;
    if(g.col==='members'||g.col==='vendors'){
      var doc=clean(keep),fl=g.col==='members'?['flat','nick','photo','pledge']:['type','contact','addr','pay','note'];
      var ph=g.col==='members'?['phone']:['phone','phone2'];
      for(var j=0;j<g.drop.length;j++){var d=g.drop[j];
        fl.forEach(function(f){if(!doc[f]&&d[f])doc[f]=d[f]});
        ph.forEach(function(f){if(!doc[f]&&!doc[f+'Enc']){if(d[f])doc[f]=d[f];else if(d[f+'Enc'])doc[f+'Enc']=d[f+'Enc']}});
        if(g.col==='members'){var rr=rolesOf(doc).filter(function(r){return r!=='Admin'});rolesOf(d).forEach(function(r){if(r!=='Admin'&&rr.indexOf(r)<0)rr.push(r)});if(doc.wrap)rr.unshift('Admin');doc.roles=rr;delete doc.role;
          for(var a=0;a<S.collections.length;a++){var c=S.collections[a];if(c.memberId===d.id){var cd=clean(c);cd.memberId=keep.id;await put('collections',c.id,cd)}}
          for(var b=0;b<S.departed.length;b++){var dp=S.departed[b];if(dp.memberId===d.id){var dd=clean(dp);dd.memberId=keep.id;await put('departed',dp.id,dd)}}}
        else{for(var e=0;e<S.expenses.length;e++){var ex=S.expenses[e];if(ex.vendorId===d.id){var ed=clean(ex);ed.vendorId=keep.id;await put('expenses',ex.id,ed)}}}}
      await put(g.col,keep.id,doc)}
    for(var k=0;k<g.drop.length;k++){if(await del(g.col,g.drop[k].id))n++}}
  closeSheet();toast(n+' duplicates removed');refresh()}

/* ---------- boot ---------- */
function markReady(c){delete pending[c];if(!Object.keys(pending).length){state='ready';clearTimeout(timer)}}
async function boot(){
  onRoute();
  var hasClaude=window.claude&&typeof window.claude.use==='function';
  try{if(hasClaude)db=await window.claude.use('db')}catch(e){db=null}
  try{if(hasClaude){var u=await window.claude.use('user');USERAPI=u;if(u&&u.can){var cw=await u.can('data.write');if(cw===false)canWrite=false}try{if(u&&u.isOwner)IS_OWNER=!!(await u.isOwner())}catch(e){}try{if(u&&u.id)ME_ID=await u.id()}catch(e){}}}catch(e){}
  if(!db){
    loadLocal();state='ready';
    banner='Entries are saved on this device only and are not shared with other devices.';
    renderPage();
    checkEnc().then(function(has){if(has){fillBody();if(!S.members.length&&!S.collections.length&&route!=='tribute')unlockSheet()}});return}
  COLS.forEach(function(c){pending[c]=1});
  timer=setTimeout(function(){if(Object.keys(pending).length){state='slow';banner='Saved data cannot be reached yet. Showing what has loaded so far.';refresh()}},10000);
  if(!canWrite){banner='View only: you can read the accounts but not change them.'}
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      if(c==='meta'){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});S.meta=m}
      else S[c]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
      LASTSYNC=Date.now();
      if(!snap.metadata.fromCache){markReady(c);if(state==='ready'&&banner.indexOf('cannot be reached')>=0&&canWrite)banner=''}
      refresh()},
    function(err){markReady(c);if(err&&err.code==='revoked'){banner='Access to the saved data changed. Showing the last loaded entries.'}else{banner='Could not load some saved data.'}refresh()})});
  renderPage()}
renderPage();
boot();
})();
</script>
