<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#17132B">
<title>Akato Sangha Accounts</title>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Tiro+Bangla:ital@0;1&display=swap">
<style>
/* Layout: night-blue header band over a chalk ground; 2-column tile dashboard, Excel-style grid tables, bottom sheets for entry detail. Tribute opens on a lamp-lit night panel. */
:root{
  --bg:#FAF6F5; --surface:#FFFFFF; --ink:#211A33; --muted:#6A6279; --line:#E3D8D8; --chip:#F2E9E7;
  --accent:#B4510B; --accent-ink:#FFFFFF; --gold:#C98A0B;
  --dr:#1D4ED8; --cr:#C62828; --ok:#1F7A4D;
  --night:#17132B; --night-ink:#F6E9D2; --night-gold:#F0B83A;
  --font-display:"Tiro Bangla","Hind Siliguri",Georgia,serif;
  --font-body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13101F; --surface:#1D1930; --ink:#F1EBF5; --muted:#A79FB8; --line:#342E4A; --chip:#272140;
    --accent:#F0A030; --accent-ink:#1B1204; --gold:#F0B83A;
    --dr:#7FA8FF; --cr:#FF8A80; --ok:#6FD3A0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13101F; --surface:#1D1930; --ink:#F1EBF5; --muted:#A79FB8; --line:#342E4A; --chip:#272140;
  --accent:#F0A030; --accent-ink:#1B1204; --gold:#F0B83A;
  --dr:#7FA8FF; --cr:#FF8A80; --ok:#6FD3A0; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
body.on-tribute::before{background:#0F0C1E}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dr{color:var(--dr);font-family:var(--font-num);font-weight:600;white-space:nowrap}
.cr{color:var(--cr);font-family:var(--font-num);font-weight:600;white-space:nowrap}
.zero,.num{font-family:var(--font-num);white-space:nowrap}
.muted{color:var(--muted)}
.sm{font-size:12.5px}

/* top bar: full-bleed band, content aligned to page gutter */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--night);color:var(--night-ink);
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.15;flex:1;min-width:0;text-wrap:balance}
.top h1 small{display:block;font-family:var(--font-body);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--night-gold);margin-top:1px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid rgba(246,233,210,.28);background:transparent;color:var(--night-ink);display:grid;place-items:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.banner{margin:10px 0 0;padding:8px 10px;border:1px solid var(--line);background:var(--chip);border-radius:8px;font-size:13px}

/* icons */
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* dashboard */
.hero{margin-top:14px;padding:16px;border-radius:14px;background:var(--night);color:var(--night-ink)}
.hero .lab{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--night-gold)}
.hero .big{font-family:var(--font-num);font-size:30px;font-weight:600;margin:2px 0 6px}
.hero .big .dr{color:#9DBBFF}.hero .big .cr{color:#FF9D95}.hero .big .zero{color:var(--night-ink)}
.hero .row{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.hero .row span.k{opacity:.75;margin-right:4px}
.hero .row .dr{color:#9DBBFF}.hero .row .cr{color:#FF9D95}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:13px 13px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.tile:active{background:var(--chip)}
.tile .t{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600;font-size:13.5px}
.tile .v{font-family:var(--font-num);font-size:19px;font-weight:600;overflow-wrap:anywhere}
.tile .s{font-size:12.5px;color:var(--muted)}
.tile.wide{grid-column:1/-1}
h2.sec{font-family:var(--font-display);font-weight:400;font-size:17px;margin:20px 0 8px}

/* toolbars */
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 8px}
.bar .grow{flex:1 1 140px;min-width:0}
.in{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
select.in{padding-right:6px}
.btn{min-height:42px;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--cr);border-color:var(--cr);color:#fff}
:root[data-theme="dark"] .btn.danger{color:#1B0A09}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.danger{color:#1B0A09}}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px}

/* Excel-style tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th,.tb td{border:1px solid var(--line);padding:7px 6px;vertical-align:top;text-align:left}
.tb th{background:var(--chip);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tb td.r,.tb th.r{text-align:right}
.tb tbody tr[data-act]{cursor:pointer}
.tb tbody tr[data-act]:active{background:var(--chip)}
.tb tfoot td{background:var(--chip);font-weight:600}
.tb .two{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tb .sub{display:block;font-size:11.5px;color:var(--muted)}
.tb td:first-child,.tb th:first-child{border-left:0}.tb td:last-child,.tb th:last-child{border-right:0}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.empty b{display:block;color:var(--ink);margin-bottom:2px}
.bar2{height:5px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:4px}
.bar2 i{display:block;height:100%;background:var(--accent)}
.bar2 i.over{background:var(--cr)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;font-size:11px;color:var(--muted);border-radius:8px}
.nav a[aria-current="page"]{color:var(--accent);font-weight:600}
.nav .ic{width:21px;height:21px}

/* sheet */
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,8,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sh{width:100%;max-width:560px;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sh .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh .hd h3{margin:0;flex:1;font-family:var(--font-display);font-weight:400;font-size:18px}
.sh .hd button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:20px;line-height:1}
.fld{display:block;margin:0 0 10px}
.fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1.3fr .8fr 1fr;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts .grow{flex:1}
.irow{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.irow .top2{display:flex;gap:6px;margin-bottom:6px}
.irow .top2 .in{flex:1}
.irow .rm{width:38px;border:1px solid var(--line);background:transparent;border-radius:8px;cursor:pointer;font-size:18px;color:var(--cr)}
.tot{display:flex;justify-content:space-between;padding:8px 2px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--night);color:var(--night-ink);padding:9px 14px;border-radius:10px;font-size:13.5px;max-width:90%}

/* tribute */
.tr{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:26px max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 60% at 50% 0%,#2B1D4D 0%,#150F28 55%,#0F0C1E 100%);color:#F6E9D2;min-height:100vh}
.tr .in{background:#1D1735;border-color:#41366A;color:#F6E9D2}
.tr .in::placeholder{color:#8F84AE}
.tr .btn{background:#F0B83A;border-color:#F0B83A;color:#1B1204}
.tr .wrapt{max-width:520px;margin:0 auto}
.diya{position:relative;width:92px;height:70px;margin:0 auto 6px}
.diya .bowl{position:absolute;left:6px;right:6px;bottom:0;height:30px;border-radius:6px 6px 46px 46px/6px 6px 30px 30px;background:linear-gradient(#D9772B,#8F3C12)}
.diya .glow{position:absolute;left:50%;top:6px;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,80,.38),transparent 65%)}
.diya .fl{position:absolute;left:50%;bottom:28px;width:22px;height:38px;margin-left:-11px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(ellipse at 50% 75%,#FFF3C4 0 25%,#FFC247 55%,#F0701E 100%);transform-origin:50% 100%}
@media (prefers-reduced-motion: no-preference){
  .diya .fl{animation:flick 2.6s ease-in-out infinite}
  .diya .glow{animation:glow 3.2s ease-in-out infinite}
}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-1deg)}30%{transform:scale(.94,1.06) rotate(2deg)}60%{transform:scale(1.03,.96) rotate(-2deg)}}
@keyframes glow{0%,100%{opacity:.85}50%{opacity:1}}
.tr h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,10vw,48px);line-height:1.1;margin:8px 0 4px;text-align:center;color:#F0B83A}
.tr .org{text-align:center;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#CDBFE6}
.tr .msg{margin:18px auto 0;max-width:46ch;text-align:center;font-size:16px;color:#EBDDC4}
.tr .mantra{margin:16px 0 0;text-align:center;font-family:var(--font-display);font-size:19px;color:#F0B83A}
.tr .mantra small{display:block;font-family:var(--font-body);font-size:12.5px;color:#B9AEC9;letter-spacing:.05em;margin-top:2px}
.tr h2{font-family:var(--font-display);font-weight:400;font-size:18px;margin:28px 0 8px;color:#F6E9D2}
.tr .wall{display:grid;gap:8px;margin-top:10px}
.tr .tc{padding:10px 12px;border:1px solid #3A2F60;border-radius:10px;background:#1A1431}
.tr .tc p{margin:0 0 4px;color:#F1E5CE;overflow-wrap:anywhere}
.tr .tc .by{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#B9AEC9}
.tr .tc button{background:none;border:0;color:#B9AEC9;cursor:pointer;font-size:12px;padding:0}
.tr .empty{background:#1A1431;border-color:#3A2F60;color:#B9AEC9}.tr .empty b{color:#F6E9D2}
.tr .enter{display:block;width:100%;margin-top:22px;min-height:48px;font-size:16px}
.rsel{min-height:34px;padding:3px 4px;font-size:12.5px;min-width:118px}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--chip);border:1px solid var(--line);display:inline-grid;place-items:center;font-size:13px;font-weight:600;color:var(--accent);flex:none}
.av.lg{width:56px;height:56px;font-size:20px}
.av.xl{width:88px;height:88px;font-size:30px}
.mc{display:flex;align-items:center;gap:8px;min-width:0}
.wa{margin-top:12px}
.wab{display:grid;place-items:center;text-decoration:none;background:#187A41;border-color:#187A41;color:#fff;width:100%;margin-bottom:6px}
.mcn{min-width:0}
.pv{display:flex;justify-content:center;margin-bottom:10px}
.phb{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.phb-a{display:flex;gap:6px;flex-wrap:wrap}
.tr .dh{display:flex;gap:12px;align-items:center}
.tr .av{border-color:#41366A;background:#1D1735;color:#F0B83A}
.tr .trtop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:26px 0 10px;color:#CDBFE6;font-size:13px;letter-spacing:.04em}
.tr .dc h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:19px;color:#F0B83A}
.tr .dmeta{font-size:12.5px;color:#B9AEC9;margin:2px 0 6px}
.tr .tl{margin:8px 0 0;padding-left:10px;border-left:2px solid #6B5A2E;font-size:14px;color:#F1E5CE;overflow-wrap:anywhere}
.tr .tl .by{display:block;font-size:12px;color:#B9AEC9}
.tr .dact{display:flex;gap:8px;margin-top:12px}
.tr .dact .btn{background:#F0B83A;border:1px solid #F0B83A;color:#1B1204;min-height:34px;padding:4px 12px;font-size:13px;font-weight:600}
.tr .dact .btn.ghost{background:transparent;color:#F0B83A}
.tr .trtop .btn{background:#F0B83A;border-color:#F0B83A;color:#1B1204}
</style>

<div id="app"></div>
<div id="layer"></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
var money=function(n){return '₹'+nf.format(n||0)};
var r2=function(n){return Math.round((n||0)*100)/100};
var drcr=function(n){n=r2(n);if(n>0)return '<span class="dr">'+money(n)+' Dr</span>';if(n<0)return '<span class="cr">'+money(-n)+' Cr</span>';return '<span class="zero">₹0</span>'};
var dr=function(n){return n?'<span class="dr">'+money(n)+'</span>':''};
var cr=function(n){return n?'<span class="cr">'+money(n)+'</span>':''};
var sum=function(a,f){return a.reduce(function(s,x){return s+(+f(x)||0)},0)};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var todayISO=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var dshort=function(i){var p=(i||'').split('-');return p.length===3?p[2]+' '+MON[+p[1]-1]:''};
var dlong=function(i){var p=(i||'').split('-');return p.length===3?p[2]+' '+MON[+p[1]-1]+' '+p[0]:''};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};

var MODES=['Cash','UPI','Bank Transfer','Cheque','Online / Card'];
var CATS=['Member subscription','Donation','Advertisement / Sponsor','Stall / Rent','Other'];
var ROLES=['President','Vice President','Secretary','Joint Secretary','Treasurer','Cashier','Puja Convenor','Collection In-charge','Pandal & Decoration','Bhog & Prasad','Volunteer Captain','Advisor','Member'];
var DEF_HEADS=['Pandal & Decoration','Pratima (Idol)','Puja Samagri','Flowers & Garlands','Bhog & Prasad','Purohit Dakshina','Dhak & Music','Lighting & Electrical','Sound System','Printing & Banners','Transport','Immersion','Miscellaneous'];

var COLS=['members','vendors','collections','expenses','departed','tributes','meta'];
var S={members:[],vendors:[],collections:[],expenses:[],departed:[],tributes:[],meta:{}};
var db=null,canWrite=true,state='loading',banner='',pending={},timer=null;
var F={q:'',mode:'',cat:'',head:''};
var route='tribute';

/* ---------- data helpers ---------- */
var heads=function(){return (S.meta.heads&&S.meta.heads.list)||DEF_HEADS};
var budgets=function(){return S.meta.budgets||{}};
var allRoles=function(){var c=(S.meta.roles&&S.meta.roles.list)||[];return ROLES.concat(c.filter(function(r){return ROLES.indexOf(r)<0}))};
var find=function(col,id){return S[col].filter(function(x){return x.id===id})[0]};
var paid=function(mid){return sum(S.collections.filter(function(c){return c.memberId===mid}),function(c){return c.amount})};
var iAmt=function(i){return (+i.qty||0)*(+i.rate||0)};
var eTotal=function(e){return sum(e.items||[],iAmt)};
var headEntries=function(h){var out=[];S.expenses.forEach(function(e){var its=(e.items||[]).filter(function(i){return i.head===h});if(its.length)out.push({e:e,its:its,a:sum(its,iAmt)})});
  out.sort(function(a,b){return (a.e.date||'').localeCompare(b.e.date||'')||(a.e.ts||0)-(b.e.ts||0)});return out};
var headSpent=function(h){return sum(headEntries(h),function(x){return x.a})};
var byDate=function(a,b){return (a.date||'').localeCompare(b.date||'')||(a.ts||0)-(b.ts||0)};
var nextNo=function(list,key,pre){var m=0;list.forEach(function(x){var n=parseInt(String(x[key]||'').replace(/\D/g,''),10);if(n>m)m=n});return pre+String(m+1).padStart(3,'0')};
var bookRows=function(){var r=[];
  S.collections.forEach(function(c){r.push({k:'c',date:c.date,ts:c.ts||0,c:c,dr:+c.amount||0,cr:0,mode:c.mode})});
  S.expenses.forEach(function(e){r.push({k:'e',date:e.date,ts:e.ts||0,e:e,dr:0,cr:eTotal(e),mode:e.mode})});
  r.sort(byDate);return r};
var expHeadLabel=function(e){var hs=[];(e.items||[]).forEach(function(i){if(hs.indexOf(i.head)<0)hs.push(i.head)});return hs.length>1?'Multiple heads ('+hs.length+')':(hs[0]||'')};
var itemNames=function(its){var n=its.map(function(i){return i.name}).filter(Boolean);return n.length?n.slice(0,2).join(', ')+(n.length>2?' +'+(n.length-2):''):''};

/* ---------- storage ---------- */
function persistLocal(){try{localStorage.setItem('aks-local',JSON.stringify(S))}catch(e){}}
function loadLocal(){try{var j=JSON.parse(localStorage.getItem('aks-local')||'null');if(j)COLS.forEach(function(c){if(j[c])S[c]=j[c]})}catch(e){}}
function errMsg(e){var c=e&&e.code;if(c==='quota_exceeded')return 'Storage is full. Delete old entries first.';if(c==='invalid_argument')return 'You do not have permission to save here.';if(c==='resource_exhausted')return 'Too many requests. Wait a moment and retry.';return 'Could not save. Check your connection and retry.'}
async function put(col,id,data){
  if(db){try{await db.collection(col).doc(id).set(data)}catch(e){toast(errMsg(e));return false}}
  else{if(col==='meta'){S.meta[id]=data}else{var a=S[col],i=a.findIndex(function(x){return x.id===id});var o=Object.assign({id:id},data);if(i<0)a.push(o);else a[i]=o}persistLocal();refresh()}
  return true}
async function del(col,id){
  if(db){try{await db.collection(col).doc(id).delete()}catch(e){toast(errMsg(e));return false}}
  else{S[col]=S[col].filter(function(x){return x.id!==id});persistLocal();refresh()}
  return true}

   tribute:{tribute:true,bar:tributeBar,body:tributeBody},
   home:{title:'Akato Sangha',sub:'Kali Puja accounts · '+new Date().getFullYear(),body:homeBody,nav:'home'},
   members:{title:'Members',sub:'Member list',bar:membersBar,body:membersBody,nav:'members',back:'home'},
   committee:{title:'Working Committee',sub:'Roles from member list',bar:committeeBar,body:committeeBody,back:'home'},
   vendors:{title:'Vendors',sub:'Details for future reference',bar:vendorsBar,body:vendorsBody,nav:'spend',back:'spend'},
   collect:{title:'Collections',sub:'Receipts by mode',bar:collectBar,body:collectBody,nav:'collect',back:'home'},

  var d=routeDef(route);var bx=$('#barx');
  if(bx&&d.bar&&route.indexOf('ledger-')===0&&!(document.activeElement&&document.activeElement.id==='bud'))bx.innerHTML=d.bar();
  fillBody()}
function onRoute(){
  var h=location.hash.slice(1);
  var r=h||'tribute';
  if(r!=='tribute'&&r!=='home'&&!/^(members|committee|collect|spend|vendors|ledgers|cashbook|ledger-\d+)$/.test(r))r='home';
  if(r!==route||!$('#app').innerHTML){route=r;F={q:'',mode:'',cat:'',head:''};closeSheet();renderPage()}}

/* ---------- actions ---------- */
var A={
 'noop':function(){},
 'close':closeSheet,
 'ov':function(el,ev){if(ev.target===el)closeSheet()},
 'add-member':function(){memberForm()},
 'edit-member':function(el){memberForm(find('members',el.dataset.id))},
 'view-member':function(el){memberView(el.dataset.id)},
 'ph-cam':function(){$('#ph-cam').click()},
 'ph-up':function(){$('#ph-up').click()},
 'ph-rm':function(){pendingPhoto='';updatePhoto()},
 'add-departed':function(){departedForm()},
 'edit-departed':function(el){departedForm(find('departed',el.dataset.id))},
 'pay-tribute':function(el){tributeForm(el.dataset.id)},
 'add-vendor':function(){vendorForm()},
 'edit-vendor':function(el){vendorForm(find('vendors',el.dataset.id))},
 'view-vendor':function(el){vendorView(el.dataset.id)},
 'add-collection':function(el){collectionForm(null,el.dataset.member)},
 'edit-collection':function(el){collectionForm(find('collections',el.dataset.id))},
 'view-collection':function(el){collectionView(el.dataset.id)},
 'add-expense':function(el){expenseForm(null,el.dataset.head,el.dataset.vendor)},
 'edit-expense':function(el){expenseForm(find('expenses',el.dataset.id))},
 'view-expense':function(el){expenseView(el.dataset.id)},
 'add-item':function(){var last=document.querySelectorAll('#items .i-head');var dh=last.length?last[last.length-1].value:null;$('#items').insertAdjacentHTML('beforeend',itemRow(null,dh));calcTotal()},
 'rm-item':function(el){var rows=document.querySelectorAll('#items .irow');if(rows.length>1){el.closest('.irow').remove();calcTotal()}},
 'add-head':function(){headForm()},
 'open-ledger':function(el){location.hash='ledger-'+el.dataset.i},
 'ask-del':function(el){confirmSheet(el.dataset.col,el.dataset.id,el.dataset.label)},
 'del-tribute':function(el){var t=find('tributes',el.dataset.id);confirmSheet('tributes',el.dataset.id,'the tribute from '+(t?t.name:'this member'))},
 'do-del':async function(el){var ok=await del(el.dataset.col,el.dataset.id);if(ok){closeSheet();toast('Deleted')}}
};
document.addEventListener('click',function(ev){if(ev.target.closest('select'))return;var el=ev.target.closest('[data-act]');if(!el)return;var f=A[el.dataset.act];if(f)f(el,ev)});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&$('#layer .ov')){closeSheet();return}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('tr[data-act]')){ev.preventDefault();ev.target.click()}});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.f){F[t.dataset.f]=t.value;fillBody()}
  if(t.closest&&t.closest('#items'))calcTotal()});
document.addEventListener('change',async function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.f){F[t.dataset.f]=t.value;fillBody();return}
  if(t.id==='ph-cam'||t.id==='ph-up'){var pf=t.files&&t.files[0];if(pf){try{pendingPhoto=await fileToPhoto(pf);updatePhoto()}catch(err){toast('Could not read that photo')}}t.value='';return}
  if(t.id==='m-role'){var w=$('#m-role-w');if(w)w.hidden=t.value!=='__new';return}
  if(t.dataset&&t.dataset.role){var mm=find('members',t.dataset.role);if(!mm)return;if(t.value==='__new'){fillBody();roleSheet(mm.id);return}await setRole(mm,t.value);return}
  if(t.id==='e-vendor'){var ow=$('#e-oth-w');if(ow)ow.hidden=t.value!=='__other';return}
  if(t.id==='d-member'){var dm=find('members',t.value);if(dm)$('#d-name').value=dm.name;return}
  if(t.id==='r-member'){var m=find('members',t.value);if(m){$('#r-payer').value=m.name;$('#r-phone').value=m.phone||'';$('#r-cat').value='Member subscription'}return}
  if(t.dataset&&t.dataset.budget!==undefined&&t.id==='bud'){
    var b=Object.assign({},budgets());b[t.dataset.budget]=+t.value||0;
    var ok=await put('meta','budgets',b);if(ok)toast('Budget saved')}});

var H={
 'f-tribute':async function(f){
   var ok=await put('tributes',uid(),{forId:f.dataset.for,name:$('#t-name').value.trim(),text:$('#t-text').value.trim(),ts:Date.now()});
   if(ok){closeSheet();toast('Tribute offered')}},
 'f-departed':async function(f){
   var id=f.dataset.id||uid(),o=find('departed',id)||{};
   var ok=await put('departed',id,{name:$('#d-name').value.trim(),memberId:$('#d-member').value,date:$('#d-date').value,note:$('#d-note').value.trim(),ts:o.ts||Date.now()});
   if(ok){closeSheet();toast('Saved')}},
 'f-member':async function(f){
   var id=f.dataset.id||uid(),o=find('members',id)||{};
   var role=$('#m-role').value;if(role==='__new')role=$('#m-role-o').value.trim();
   if(role&&!(await ensureRole(role)))return;
   var ok=await put('members',id,{name:$('#m-name').value.trim(),flat:$('#m-flat').value.trim(),phone:$('#m-phone').value.trim(),pledge:+$('#m-pledge').value||0,role:role,photo:(pendingPhoto===undefined?(o.photo||''):pendingPhoto),ts:o.ts||Date.now()});
   if(ok){closeSheet();toast(role?'Saved. Listed in Working Committee as '+role:'Member saved')}},
 'f-role':async function(f){
   var m=find('members',f.dataset.id),r=$('#nr-name').value.trim();if(!m||!r)return;
   if(!(await ensureRole(r)))return;
   var ok=await setRole(m,r);if(ok)closeSheet()},
 'f-vendor':async function(f){
   var id=f.dataset.id||uid(),o=find('vendors',id)||{};
   var ok=await put('vendors',id,{name:$('#v-name').value.trim(),type:$('#v-type').value,contact:$('#v-contact').value.trim(),phone:$('#v-phone').value.trim(),phone2:$('#v-phone2').value.trim(),addr:$('#v-addr').value.trim(),pay:$('#v-pay').value.trim(),note:$('#v-note').value.trim(),ts:o.ts||Date.now()});
   if(ok){closeSheet();toast('Vendor saved')}},
'f-collection':async function(f){
   var id=f.dataset.id||uid(),o=find('collections',id)||{};
   var amt=+$('#r-amt').value;if(!(amt>0)){toast('Enter an amount');return}
   var cd={date:$('#r-date').value,rno:$('#r-no').value.trim(),memberId:$('#r-member').value,payer:$('#r-payer').value.trim(),cat:$('#r-cat').value,mode:$('#r-mode').value,amount:amt,ref:$('#r-ref').value.trim(),by:$('#r-by').value,note:$('#r-note').value.trim(),phone:$('#r-phone').value.trim(),ts:o.ts||Date.now()};var ok=await put('collections',id,cd);
   if(ok){collectionView(id,Object.assign({id:id},cd),true)}},
 'f-expense':async function(f){
   var id=f.dataset.id||uid(),o=find('expenses',id)||{},items=[];
   document.querySelectorAll('#items .irow').forEach(function(r){var rate=+$('.i-rate',r).value||0,qty=+$('.i-qty',r).value||0,name=$('.i-name',r).value.trim();if(rate>0&&qty>0)items.push({name:name,head:$('.i-head',r).value,qty:qty,rate:rate})});
   if(!items.length){toast('Add at least one item with a rate');return}
   var vv=$('#e-vendor').value,payee='',vid='';
   if(vv==='__other'){payee=$('#e-payee-o').value.trim();if(!payee){toast('Enter the vendor name');return}
     var ex=S.vendors.filter(function(v){return v.name.toLowerCase()===payee.toLowerCase()})[0];
     if(ex){vid=ex.id;payee=ex.name}else if($('#e-save-v').checked){vid=uid();if(!(await put('vendors',vid,{name:payee,ts:Date.now()})))return}}
   else if(vv){var vd=find('vendors',vv);vid=vv;payee=vd?vd.name:''}
   else{toast('Select a vendor');return}
   var ok=await put('expenses',id,{date:$('#e-date').value,vno:$('#e-no').value.trim(),payee:payee,vendorId:vid,mode:$('#e-mode').value,ref:$('#e-ref').value.trim(),items:items,note:$('#e-note').value.trim(),ts:o.ts||Date.now()});
   if(ok){closeSheet();toast('Voucher saved')}},
 'f-head':async function(){
   var n=$('#h-name').value.trim(),hs=heads().slice();
   if(hs.some(function(x){return x.toLowerCase()===n.toLowerCase()})){toast('That head already exists');return}
   hs.push(n);var ok=await put('meta','heads',{list:hs});if(ok){closeSheet();toast('Head added')}}
};
document.addEventListener('submit',function(ev){ev.preventDefault();var f=ev.target;if(H[f.id])H[f.id](f)});
window.addEventListener('hashchange',onRoute);

/* ---------- boot ---------- */
function markReady(c){delete pending[c];if(!Object.keys(pending).length){state='ready';clearTimeout(timer)}}
async function boot(){
  onRoute();
  var hasClaude=window.claude&&typeof window.claude.use==='function';
  try{if(hasClaude)db=await window.claude.use('db')}catch(e){db=null}
  try{if(hasClaude){var u=await window.claude.use('user');if(u&&u.can){var cw=await u.can('data.write');if(cw===false)canWrite=false}}}catch(e){}
  if(!db){
    loadLocal();state='ready';
    banner='Entries are saved on this device only and are not shared with other devices.';
    renderPage();return}
  COLS.forEach(function(c){pending[c]=1});
  timer=setTimeout(function(){if(Object.keys(pending).length){state='slow';banner='Saved data cannot be reached yet. Showing what has loaded so far.';refresh()}},10000);
  if(!canWrite){banner='View only: you can read the accounts but not change them.'}
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      if(c==='meta'){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});S.meta=m}
      else S[c]=snap.docs.map(function(d){return Object.assign({},d.data(),{id:d.id})});
      if(!snap.metadata.fromCache){markReady(c);if(state==='ready'&&banner.indexOf('cannot be reached')>=0&&canWrite)banner=''}
      refresh()},
    function(err){markReady(c);if(err&&err.code==='revoked'){banner='Access to the saved data changed. Showing the last loaded entries.'}else{banner='Could not load some saved data.'}refresh()})});
  renderPage()}
renderPage();
boot();
})();
</script>
